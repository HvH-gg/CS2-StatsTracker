name: Build & Publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.MD'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract version number from README.md
        id: extract_version
        run: |
          VERSION=$(grep -oP '(?<=# \[HvH\.gg\]\(https:\/\/hvh\.gg\) CS2 Stats Tracker \()[0-9]+\.[0-9]+\.[0-9]+' README.MD)
          if [ -z "$VERSION" ]; then
            echo "No version number found in README.md. Exiting."
            exit 1
          fi
          echo "VERSION_NUMBER=$VERSION" >> $GITHUB_ENV

      - name: Check if version already exists
        id: check_version
        run: |
          if gh release view "${{ env.VERSION_NUMBER }}" > /dev/null 2>&1; then
            echo "Version ${{ env.VERSION_NUMBER }} already exists. Exiting."
            exit 0
          fi

      - name: Build runtime ${{ env.VERSION_NUMBER }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /p:Version=${{ env.VERSION_NUMBER }}

      - name: Extract NuGet package names from .csproj
        id: extract_packages
        run: |
          # Extract package names from the .csproj file
          PACKAGE_NAMES=$(xmllint --xpath 'string-join(//PackageReference/@Include, " ")' HvH-StatsTracker/HvH-StatsTracker.csproj)
          # Export for use in subsequent steps
          echo "PACKAGE_NAMES=$PACKAGE_NAMES" >> $GITHUB_ENV

      - name: Copy required NuGet DLLs to release
        run: |
          mkdir -p release/addons/counterstrikesharp/plugins/HvH-StatsTracker
          for package in $PACKAGE_NAMES; do
            # Find and copy each package's DLL files to the release directory
            find ~/.nuget/packages/$package -name "*.dll" -exec cp {} release/addons/counterstrikesharp/plugins/HvH-StatsTracker/ \;
          done


      - name: Create necessary directory structure and copy files
        run: |
          mkdir -p release/addons/counterstrikesharp/configs/plugins/HvH-StatsTracker
          cp HvH-StatsTracker/HvH-StatsTracker.json.config.example release/addons/counterstrikesharp/configs/plugins/HvH-StatsTracker/HvH-StatsTracker.json
          cp -r HvH-StatsTracker/bin/Release/net8.0/* release/addons/counterstrikesharp/plugins/HvH-StatsTracker/

      - name: Create a ZIP file with binaries
        run: |
          cd release
          zip -r ../HvH-StatsTracker-${{ env.VERSION_NUMBER }}-${{ env.GITHUB_SHA_SHORT }}.zip addons

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          release_name: ${{ env.VERSION_NUMBER }}
          draft: false
          prerelease: false
          body: |
            ## Changes
            - Auto-generated release
            ${{ github.event.head_commit.message }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./HvH-StatsTracker-${{ env.VERSION_NUMBER }}-${{ env.GITHUB_SHA_SHORT }}.zip
          asset_name: HvH-StatsTracker-${{ env.VERSION_NUMBER }}-${{ env.GITHUB_SHA_SHORT }}.zip
          asset_content_type: application/zip
