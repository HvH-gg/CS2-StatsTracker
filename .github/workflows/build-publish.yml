name: Build & Publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.MD'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      exists: ${{ steps.check_version.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract version number from README.md
        id: extract_version
        run: |
          VERSION=$(grep -oP '(?<=# \[HvH\.gg\]\(https:\/\/hvh\.gg\) CS2 Stats Tracker \()[0-9]+\.[0-9]+\.[0-9]+' README.MD)
          if [ -z "$VERSION" ]; then
            echo "No version number found in README.md. Exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # releases are tagged v<version>, see "Create GitHub Release" below
          if gh release view "v${{ steps.extract_version.outputs.version }}" > /dev/null 2>&1; then
            echo "Version ${{ steps.extract_version.outputs.version }} already exists. Skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NUMBER: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build runtime ${{ env.VERSION_NUMBER }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /p:Version=${{ env.VERSION_NUMBER }}

      - name: Copy specific NuGet DLLs
        run: |
          mkdir -p release/addons/counterstrikesharp/plugins/CS2-StatsTracker
          # Define array of required packages
          PACKAGES=(
            "microsoft.extensions.http"
            "asyncawaitbestpractices"
            "cssharputils"
          )
          # Loop through packages and copy DLLs
          for package in "${PACKAGES[@]}"; do
            find ~/.nuget/packages/$package/ -name "*.dll" -exec cp {} release/addons/counterstrikesharp/plugins/CS2-StatsTracker/ \;
          done

      - name: Create necessary directory structure and copy files
        run: |
          mkdir -p release/addons/counterstrikesharp/configs/plugins/CS2-StatsTracker
          cp CS2-StatsTracker/CS2-StatsTracker.json.config.example release/addons/counterstrikesharp/configs/plugins/CS2-StatsTracker/CS2-StatsTracker.json
          cp -r CS2-StatsTracker/bin/Release/net10.0/* release/addons/counterstrikesharp/plugins/CS2-StatsTracker/

      - name: Create a ZIP file with binaries
        run: |
          cd release
          zip -r ../CS2-StatsTracker-${{ env.VERSION_NUMBER }}-${{ env.GITHUB_SHA_SHORT }}.zip addons

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          release_name: ${{ env.VERSION_NUMBER }}
          draft: false
          prerelease: false
          body: |
            ## Changes
            - Auto-generated release
            ${{ github.event.head_commit.message }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./CS2-StatsTracker-${{ env.VERSION_NUMBER }}-${{ env.GITHUB_SHA_SHORT }}.zip
          asset_name: CS2-StatsTracker-${{ env.VERSION_NUMBER }}-${{ env.GITHUB_SHA_SHORT }}.zip
          asset_content_type: application/zip
